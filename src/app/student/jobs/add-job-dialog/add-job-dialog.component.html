<div class="addContainer">
  <div class="modalHeader">
    <div class="modalTitle">
      <mat-icon style="vertical-align: middle; margin-right: 8px;">work</mat-icon>
      Add / Parse Job Description
    </div>
    <button mat-icon-button (click)="onNoClick()" class="modal-close-button">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div mat-dialog-content>
    <form [formGroup]="jobForm" class="mt-3">
      
      <!-- Raw Text Input -->
      <mat-form-field appearance="outline" class="w-100 mb-3">
        <mat-label>Paste Job Description Here</mat-label>
        <textarea matInput formControlName="rawText" rows="6" placeholder="Copy paste the full job description..."></textarea>
      </mat-form-field>

      <!-- Action: Parse Button -->
      <div class="text-end mb-4">
        <button mat-raised-button color="accent" (click)="parseJob()" [disabled]="jobForm.get('rawText')?.invalid || isParsing">
          @if (isParsing) {
            <mat-progress-spinner mode="indeterminate" diameter="20" style="display:inline-block; vertical-align:middle;"></mat-progress-spinner>
          } @else {
            <mat-icon>auto_awesome</mat-icon>
          }
          Extract Details via AI
        </button>
      </div>

      <!-- Preview Parsed Details -->
      @if (parsedSuccess) {
        <div class="parsed-details-section p-3 mb-3" style="background-color: #f5f5f5; border-radius: 8px;">
          <h5 class="mb-3" style="color: #3f51b5;"><mat-icon style="font-size: 18px; vertical-align: bottom;">check_circle</mat-icon> Extracted Information</h5>
          
          <div class="row">
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Company Name</mat-label>
                <input matInput formControlName="companyName">
              </mat-form-field>
            </div>
            
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Work Mode</mat-label>
                <input matInput formControlName="workMode">
              </mat-form-field>
            </div>
            
            <div class="col-md-12">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Skills Required (comma separated)</mat-label>
                <input matInput formControlName="skillsRequired">
              </mat-form-field>
            </div>
            
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Contact Email</mat-label>
                <input matInput formControlName="contactEmail">
              </mat-form-field>
            </div>
            
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Contact Phone</mat-label>
                <input matInput formControlName="contactPhone">
              </mat-form-field>
            </div>
          </div>
        </div>
      }
    </form>
  </div>

  <div mat-dialog-actions align="end" class="modal-actions">
    <button mat-stroked-button (click)="onNoClick()" [disabled]="isSaving">Cancel</button>
    <button mat-flat-button color="primary" (click)="saveJob()" [disabled]="!parsedSuccess || jobForm.invalid || isSaving">
      @if (isSaving) {
        <mat-progress-spinner mode="indeterminate" diameter="20"></mat-progress-spinner>
      } @else {
        Save Job
      }
    </button>
  </div>
</div>
